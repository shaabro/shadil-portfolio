<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spider Web Cursor</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.hero{
    width:100%;
    height:100vh;

    background:#111;

    position:relative;

    overflow:hidden;
}

#webCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;
}

.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:
    translate(-50%,-50%);
    color:rgb(114, 39, 39);
    z-index:2;
}
</style>
</head>

<body>

<section class="hero">

    <canvas id="webCanvas"></canvas>

    <div class="content">
        <h1>Spider Web Effect</h1>
    </div>

</section>

<script>
const canvas =
document.getElementById(
"webCanvas"
);

const ctx =
canvas.getContext("2d");
canvas.width=
window.innerWidth;
canvas.height=
window.innerHeight;


let mouse={
x:canvas.width/2,
y:canvas.height/2
};

window.addEventListener(
"mousemove",

(e)=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
}
);

function animate(){
ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.beginPath();
ctx.arc(
mouse.x,
mouse.y,
8,
0,
Math.PI*2
);

ctx.fillStyle="orange";
ctx.fill();
requestAnimationFrame(
animate
);
}
animate();
</script>

</body>

</html>
